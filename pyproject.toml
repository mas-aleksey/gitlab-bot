[project]
name = "gitlab-bot"
version = "0.1.0"
description = "Telegram bot for GitLab operations — simplified rewrite."
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.13",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "backoff>=2.2",
    "cryptography>=42",
    "httpx[http2]>=0.27",
    "loguru>=0.7",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "sqlalchemy[asyncio]>=2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-recording>=0.13",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
packages = ["src/clients", "src/db", "src/features", "src/shared"]
force-include = { "src/app.py" = "app.py", "src/config.py" = "config.py", "src/crypto.py" = "crypto.py", "src/deps.py" = "deps.py", "src/errors.py" = "errors.py" }

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
    "ASYNC",
]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_decorators = false
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
